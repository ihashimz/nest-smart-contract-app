name: Backend checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: options_test
          POSTGRES_USER: portfolio_test
          POSTGRES_PASSWORD: portfolio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portfolio_test -d options_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://portfolio_test:portfolio_test@localhost:5432/options_test
      NODE_ENV: test
      ENABLE_EXPERIMENTAL_TRANSFERS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test -- --runInBand
      - name: Verify migration lifecycle
        run: |
          npm run migration:run
          npm run migration:revert
          npm run migration:run
      - name: Verify administrator bootstrap is repeatable
        env:
          SEED_ADMIN_EMAIL: admin@example.test
          SEED_ADMIN_PASSWORD: disposable-ci-test-password
          SEED_BANK_NAME: CI Bank
          SEED_BANK_CODE: CI
          SEED_BANK_ADDRESS: "0x1111111111111111111111111111111111111111"
        run: |
          npm run seed:admin
          npm run seed:admin
